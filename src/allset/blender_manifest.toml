schema_version = "1.0.0"

# Template: <Blender 4.5>/4.5/scripts/templates_toml/blender_manifest.toml
id = "allset"
version = "0.1.0"
name = "Allset for Maya Users"
tagline = "The whole Maya workflow in Blender, in one install"
maintainer = "ohnsk <555hyuns@gmail.com>"
type = "add-on"
# Extensions platform tags ($S\modules\_bpy_internal\extensions\tags.py; docs/DISTRIBUTION.md, step 61).
# No `website` until there is a public page; no `platforms`: pure Python, every OS.
tags = ["User Interface", "3D View", "Modeling", "Animation"]

blender_version_min = "4.2.0"
# Exclusive. Target 4.5 (decision 4); 5.0-5.2 checked in docs/steps/step_53.md. A newer Blender gets a
# clear "not compatible" from the extension system instead of a half-working kit, until it is checked.
blender_version_max = "5.3.0"

# Code GPL-3.0-or-later; the kit-made images and data files (splash / welcome PNGs, startup.blend, the theme XML)
# CC0-1.0 — extensions.blender.org terms 1.2, ASSETS_LICENSE.txt (step 114).
license = [
  "SPDX:GPL-3.0-or-later",
  "SPDX:CC0-1.0",
]
copyright = [
  "2026 ohnsk",
]

[permissions]
files = "Install the layout template, back up the theme, save shelves"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "*.blend1",
]
